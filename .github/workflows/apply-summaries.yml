name: Apply filled summaries

# pull_request does not trigger this workflow.
# The command below does not pass --apply, so a push to main only dry-runs.
# A reviewed write is a local `npm run apply-summaries -- --apply` after the provenance migration.

on:
  push:
    branches: [main]
    paths:
      - data/pending-summaries.json
      - data/filled-summaries.json
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: summary-queue
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip apply]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run apply-summaries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit summary queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending-summaries.json data/filled-summaries.json
          if git diff --staged --quiet; then
            echo "summary queue unchanged"
          else
            git commit -m "Apply filled summaries" -m "[skip apply]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - run: npm run check-pending
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
