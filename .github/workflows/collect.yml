name: Collect AI tool videos

# pull_request does not trigger this workflow. Opening a pull request does not collect or write to Supabase.
# npm run apply-summaries below is a dry-run: it does not pass --apply.

on:
  schedule:
    - cron: "0 0 * * *" # 09:00 KST daily (00:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: summary-queue
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - run: npm run apply-summaries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit summary queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending-summaries.json data/filled-summaries.json
          if git diff --staged --quiet; then
            echo "summary queue unchanged"
          else
            git commit -m "Update the summary queue" -m "[skip apply]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - run: npm run check-pending
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
